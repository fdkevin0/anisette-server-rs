name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev ninja-build
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --locked
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  image:
    needs: check
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
      - name: Package release binaries
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.arch == 'amd64' && 'x86_64-unknown-linux-gnu' || 'aarch64-unknown-linux-gnu' }}
        run: |
          pkg="anisette-server-${TAG}-${TARGET}"
          mkdir -p "/tmp/release/${pkg}" /tmp/release-out
          docker buildx build --target binaries --platform "${{ matrix.platform }}" \
            --cache-from "type=gha,scope=image-${{ matrix.arch }}" \
            --output "type=local,dest=/tmp/release/${pkg}" .
          chmod 0755 "/tmp/release/${pkg}/anisette-server" "/tmp/release/${pkg}/import_apk" "/tmp/release/${pkg}/import_itunes"
          cp LICENSE THIRD_PARTY_NOTICES.md README.md "/tmp/release/${pkg}/"
          tar -C /tmp/release -czf "/tmp/release-out/${pkg}.tar.gz" "${pkg}"
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-${{ matrix.arch }}
          path: /tmp/release-out/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        if: startsWith(github.ref, 'refs/tags/v')
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta.outputs.json }}') \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
      - uses: actions/download-artifact@v8
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          path: /tmp/release-assets
          pattern: release-*
          merge-multiple: true
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: /tmp/release-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          image="ghcr.io/${REPO,,}:${version}"
          sha256sum *.tar.gz > SHA256SUMS
          cat <<EOF > /tmp/release-notes.md
          ### Container image (GHCR)

          Multi-architecture image (\`linux/amd64\` and \`linux/arm64\`) bundling all three verified Apple ADI backends:

          \`\`\`sh
          # Android ADI backend (default)
          docker run --rm -p 127.0.0.1:6969:6969 \\
            --mount type=volume,src=anisette-android-data,dst=/data \\
            ${image} --backend android

          # macOS adid backend
          docker run --rm -p 127.0.0.1:6969:6969 \\
            --mount type=volume,src=anisette-macos-data,dst=/data \\
            ${image} --backend macos

          # Windows CoreADI backend
          docker run --rm -p 127.0.0.1:6969:6969 \\
            --mount type=volume,src=anisette-windows-data,dst=/data \\
            ${image} --backend windows
          \`\`\`

          ### Precompiled Linux binaries

          The attached \`.tar.gz\` archives contain \`anisette-server\`, \`import_apk\`, and \`import_itunes\` for \`x86_64-unknown-linux-gnu\` and \`aarch64-unknown-linux-gnu\` (no proprietary Apple binaries are included in release archives; see \`assets/README.md\` for local preparation).
          EOF
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" *.tar.gz SHA256SUMS --clobber --repo "$REPO"
            gh release edit "$TAG" --notes-file /tmp/release-notes.md --repo "$REPO"
          else
            gh release create "$TAG" *.tar.gz SHA256SUMS \
              --repo "$REPO" \
              --title "$TAG" \
              --notes-file /tmp/release-notes.md \
              --generate-notes
          fi
